<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c9e3df" />
    <link rel="icon" href="data:," />
    <title>池核漫游</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main id="app">
      <canvas id="scene" aria-label="池核三维探索场景"></canvas>

      <section id="entry" class="entry" aria-labelledby="title">
        <div class="title-lockup">
          <p class="index">POOL COMPLEX / 01</p>
          <h1 id="title">池核漫游</h1>
          <p>在无人的水域建筑中自由探索</p>
        </div>
        <button id="enter" type="button">
          <span>进入水域</span>
          <span class="enter-icon" aria-hidden="true">→</span>
        </button>
        <div class="controls" aria-label="操作方式">
          <span><kbd>WASD</kbd> 移动</span>
          <span><kbd>鼠标</kbd> 观察</span>
          <span><kbd>SHIFT</kbd> 加速</span>
          <span><kbd>SPACE</kbd> 跳跃</span>
        </div>
      </section>

      <div id="hud" class="hud is-hidden" aria-hidden="true">
        <div class="reticle"></div>
        <div class="location">
          <span id="location-name">浅水中庭</span>
          <span id="depth">水深 0.35 M</span>
        </div>
        <button id="sound" class="icon-button" type="button" aria-label="关闭声音" title="关闭声音">
          <span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i></span>
        </button>
        <p class="escape"><kbd>ESC</kbd> 暂停</p>
      </div>

      <aside id="pause" class="pause is-hidden" aria-hidden="true">
        <p>漫游已暂停</p>
        <button id="resume" type="button">继续探索 <span aria-hidden="true">→</span></button>
      </aside>

      <div id="loading" class="loading" aria-live="polite">
        <div class="loading-line"><i></i></div>
        <span>正在注水</span>
      </div>
    </main>
  </body>
</html>
